apiVersion: v1
kind: Service
metadata:
  name: tasks-api
  namespace: tasks-app
spec:
  selector:
    app.kubernetes.io/name: tasks-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tasks-api
  namespace: tasks-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: tasks-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tasks-api
        app.kubernetes.io/part-of: tasks-app
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: tasks-api:latest
          envFrom:
            - configMapRef:
                name: tasks-api-config
          env:
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: tasks-app-secrets
                  key: MONGODB_URI
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: tasks-app-secrets
                  key: REDIS_URL
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true

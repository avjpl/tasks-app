apiVersion: v1
kind: ConfigMap
metadata:
  name: tasks-waypoint-options
  namespace: tasks-app
data:
  deployment: |
    spec:
      replicas: 2
      minReadySeconds: 10
      strategy:
        rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
      template:
        spec:
          terminationGracePeriodSeconds: 45
          nodeSelector: {node-role.kubernetes.io/worker: ""}
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels: {gateway.networking.k8s.io/gateway-name: tasks-waypoint}
          containers:
            - name: istio-proxy
              resources:
                requests: {cpu: 200m, memory: 256Mi}
                limits: {cpu: 1000m, memory: 512Mi}
  podDisruptionBudget: |
    spec:
      minAvailable: 1

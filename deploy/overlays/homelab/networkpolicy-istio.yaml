apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-istio-to-tasks-web
  namespace: tasks-app
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: tasks-web}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: istio-ingress}
          podSelector:
            matchLabels: {app: istio-ingress, istio: ingress}
      ports: [{port: 8080, protocol: TCP}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-istio-to-tasks-api
  namespace: tasks-app
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: tasks-api}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: istio-ingress}
          podSelector:
            matchLabels: {app: istio-ingress, istio: ingress}
      ports: [{port: 3000, protocol: TCP}]

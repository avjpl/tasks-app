apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-istio-to-tasks-web
  namespace: tasks-app
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: tasks-web}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: istio-ingress}
          podSelector:
            matchLabels: {app: istio-ingress, istio: ingress}
      ports: [{port: 8080, protocol: TCP}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-istio-to-tasks-api
  namespace: tasks-app
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: tasks-api}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: istio-ingress}
          podSelector:
            matchLabels: {app: istio-ingress, istio: ingress}
      ports: [{port: 3000, protocol: TCP}]
---
# Reconcile before workload injection: proxies need xDS and certificate access.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-tasks-to-istiod
  namespace: tasks-app
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [tasks-api, tasks-web]
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: istio-system}
          podSelector:
            matchLabels: {app: istiod}
      ports: [{port: 15012, protocol: TCP}]

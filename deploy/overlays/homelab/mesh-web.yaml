apiVersion: apps/v1
kind: Deployment
metadata:
  name: tasks-web
  namespace: tasks-app
spec:
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        istio.io/dataplane-mode: ambient
    spec:
      terminationGracePeriodSeconds: 45
      containers:
        - name: web
          lifecycle:
            preStop:
              sleep: {seconds: 15}

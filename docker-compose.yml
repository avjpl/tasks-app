services:
  mongodb:
    image: mongo:8.0
    environment:
      MONGO_INITDB_DATABASE: tasks
      MONGO_INITDB_ROOT_PASSWORD: local-development-only
      MONGO_INITDB_ROOT_USERNAME: tasks
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "local-development-only"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "local-development-only", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mongodb-data:
  redis-data:


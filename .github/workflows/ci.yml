name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.35.0
      - run: pip install -r requirements-deployment.txt
      - run: python -B -m unittest discover -s tests/deployment
      - run: python -B scripts/validate-deployment.py

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile

      - name: Biome check
        run: bun run check

      - name: TypeScript check
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

      - name: Production builds
        run: bun run build

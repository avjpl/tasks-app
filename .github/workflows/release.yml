name: Release and promote

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  publish-and-promote:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    env:
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - name: Verify tested main revision
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          [[ "$TESTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid tested revision" >&2; exit 1; }
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          [[ "$current" == "$TESTED_SHA" ]] || { echo "Tested revision was superseded" >&2; exit 1; }

      - name: Check out the exact tested revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          path: source

      - uses: docker/setup-buildx-action@v4

      - name: Sign in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        run: |
          tested_sha="${{ github.event.workflow_run.head_sha }}"
          echo "tag=${tested_sha:0:12}" >> "$GITHUB_OUTPUT"

      - name: Build and push API
        uses: docker/build-push-action@v7
        with:
          context: source
          file: source/apps/api/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/tasks-api:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=tasks-api
          cache-to: type=gha,mode=max,scope=tasks-api

      - name: Build and push web
        uses: docker/build-push-action@v7
        with:
          context: source
          file: source/apps/web/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/tasks-web:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=tasks-web
          cache-to: type=gha,mode=max,scope=tasks-web

      - uses: imranismail/setup-kustomize@v3

      - name: Check out deployment desired state
        uses: actions/checkout@v7
        with:
          repository: avjpl/application-deployments
          ref: main
          fetch-depth: 0
          path: deployments
          ssh-key: ${{ secrets.DEPLOYMENTS_SSH_KEY }}
          ssh-strict: true

      - name: Promote tested images to deployment repository
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: bash source/scripts/promote-deployment.sh "$GITHUB_WORKSPACE/deployments" "$GITHUB_WORKSPACE/source" "$TESTED_SHA"

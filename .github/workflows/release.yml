name: Release and promote

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  publish-and-promote:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Verify the tested revision is still current
        uses: actions/github-script@v9
        with:
          script: |
            const testedSha = context.payload.workflow_run.head_sha;
            const { data: main } = await github.rest.git.getRef({
              ...context.repo,
              ref: 'heads/main',
            });
            if (!/^[0-9a-f]{40}$/.test(testedSha) || main.object.sha !== testedSha) {
              core.setFailed('Tested revision is invalid or superseded; refusing release.');
            }

      - name: Check out the exact tested revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          path: source
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.35.0
      - run: pip install -r source/requirements-deployment.txt

      - name: Compare build inputs with the last promoted source
        id: decision
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: python -B source/scripts/promote-colocated.py source "$TESTED_SHA" --check-build >> "$GITHUB_OUTPUT"

      - name: Generate immutable image tag
        id: meta
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: echo "tag=${TESTED_SHA:0:12}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.decision.outputs.build == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Sign in to GHCR
        if: steps.decision.outputs.build == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API
        if: steps.decision.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: source
          file: source/apps/api/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/tasks-api:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=tasks-api
          cache-to: type=gha,mode=max,scope=tasks-api

      - name: Build and push web
        if: steps.decision.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: source
          file: source/apps/web/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/tasks-web:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=tasks-web
          cache-to: type=gha,mode=max,scope=tasks-web

      - name: Check out current deployment desired state
        if: steps.decision.outputs.build == 'true'
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          path: desired

      - name: Validate and promote only the tested image pair
        if: steps.decision.outputs.build == 'true'
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: python -B source/scripts/promote-colocated.py desired "$TESTED_SHA"

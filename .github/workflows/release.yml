name: Release and promote

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  packages: write

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  publish-and-promote:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact tested revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v4

      - name: Sign in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        run: |
          tested_sha="${{ github.event.workflow_run.head_sha }}"
          echo "tag=${tested_sha:0:12}" >> "$GITHUB_OUTPUT"

      - name: Build and push API
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/tasks-api:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=tasks-api
          cache-to: type=gha,mode=max,scope=tasks-api

      - name: Build and push web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/tasks-web:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=tasks-web
          cache-to: type=gha,mode=max,scope=tasks-web

      - uses: imranismail/setup-kustomize@v3

      - name: Promote immutable image tags
        working-directory: k8s/overlays/homelab
        run: >-
          kustomize edit set image
          tasks-api=ghcr.io/${{ github.repository_owner }}/tasks-api:${{ steps.meta.outputs.tag }}
          tasks-web=ghcr.io/${{ github.repository_owner }}/tasks-web:${{ steps.meta.outputs.tag }}

      - name: Commit desired state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/homelab/kustomization.yaml
          git commit -m "chore(deploy): promote ${{ steps.meta.outputs.tag }}"
          git push origin HEAD:main

name: Release and promote

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  publish-and-promote:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact tested revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Sign in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tag from the tested commit
        id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_SHORT_SHA_LENGTH: 12
        with:
          context: git
          tags: type=sha,prefix=

      - name: Build and push API
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/tasks-api:${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=tasks-api
          cache-to: type=gha,mode=max,scope=tasks-api

      - name: Build and push web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/tasks-web:${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=tasks-web
          cache-to: type=gha,mode=max,scope=tasks-web

      - name: Verify the tested commit is still current on main
        uses: actions/github-script@v9
        with:
          script: |
            const testedSha = context.payload.workflow_run.head_sha;
            const { data: main } = await github.rest.git.getRef({
              ...context.repo,
              ref: 'heads/main',
            });

            if (main.object.sha !== testedSha) {
              core.setFailed('A newer commit is on main. Its successful CI run will publish the next release.');
            }

      - name: Check out deployment desired state
        uses: actions/checkout@v7
        with:
          repository: avjpl/application-deployments
          ref: main
          path: deployments
          ssh-key: ${{ secrets.DEPLOYMENTS_SSH_KEY }}
          ssh-strict: true

      - name: Update API and web image tags
        uses: mikefarah/yq@v4.54.1
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.version }}
        with:
          cmd: >-
            yq -i '(.images[] | select(.name == "tasks-api" or .name == "tasks-web")).newTag = strenv(IMAGE_TAG)'
            deployments/applications/tasks-app/overlays/homelab/kustomization.yaml

      - name: Commit and push deployment update for Argo CD
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          repository: deployments
          branch: main
          file_pattern: applications/tasks-app/overlays/homelab/kustomization.yaml
          commit_message: "chore(deploy): promote tasks-app ${{ steps.meta.outputs.version }}"
          commit_author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
